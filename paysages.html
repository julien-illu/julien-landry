<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Paysages – Julien Landry</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #fdfaf5; 
      color: #2b2b2b;

    }

      background:#1e1e24; 
      color:#fff;

    }

    header a { 
      color:#c89b3c; 
      text-decoration:none;

      transition: color .25s; 
    }
    header a:hover { color:#e2c574; }

    /* === Masonry Grid plus large et espacée === */
    .gallery {

      grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      grid-auto-rows: 15px;
      gap: 25px;
      margin: 50px;
    }

    .gallery a {
      display: block;
      grid-row-end: span var(--span);
    }

    .gallery img {
      width: 100%;
      display: block;
      border-radius: 8px;
      cursor: pointer;
    }

    /* === Lightbox === */
    .lightbox {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    footer { 
      background:#1e1e24; 
      color:white; 
      text-align:center; 
      padding:25px; 
      margin-top:20px; 
      font-size:0.9rem; 
      opacity:0.85; 
    }
  </style>
</head>
<body>
  <header>
    <h1>Paysages – Julien Landry</h1>
    <a href="index.html">← Retour au Book</a>
  </header>

  </div>

  <div class="lightbox" id="lightbox">

  </footer>

  <script>

      const rowGap = parseInt(window.getComputedStyle(gallery).getPropertyValue('gap'));
      const img = item.querySelector('img');

      if (img.complete) resizeMasonryItem(item);
